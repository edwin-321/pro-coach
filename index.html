<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pro-Trainer"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Pro-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Handy, immer genau eine große Aktion unten in der festen Leiste. */
:root{
  --bg:#f6f2f5; --surface:#ffffff; --ink:#221a22; --muted:#6f6373; --line:#e7dfe6;
  --accent:#b4235f; --accent-d:#84163f; --accent-ink:#ffffff; --accent-soft:#f8e2eb;
  --good:#1c7550; --good-d:#145a3d; --good-soft:#dcf1e7; --warn:#8a5a00; --warn-soft:#fbeed2;
  --peach:#ffb08a; --peach-d:#e9825a; --leaf:#4aa86e; --face:#3a2230; --blush:#ff7f8f;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171217; --surface:#231b23; --ink:#f4ecf2; --muted:#ac9cab; --line:#3a2e3a;
    --accent:#f2709f; --accent-d:#b94a76; --accent-ink:#2b0a18; --accent-soft:#3d1d2c;
    --good:#62cf9f; --good-d:#3f9c75; --good-soft:#17342a; --warn:#f0c26a; --warn-soft:#3a2d12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171217; --surface:#231b23; --ink:#f4ecf2; --muted:#ac9cab; --line:#3a2e3a;
  --accent:#f2709f; --accent-d:#b94a76; --accent-ink:#2b0a18; --accent-soft:#3d1d2c;
  --good:#62cf9f; --good-d:#3f9c75; --good-soft:#17342a; --warn:#f0c26a; --warn-soft:#3a2d12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 130px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}

/* Knöpfe mit Tiefe, die beim Drücken einsinken */
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 20px;border-radius:18px;margin-bottom:4px;
  background:var(--accent);color:var(--accent-ink);font:800 18px var(--display);letter-spacing:.01em;width:100%;box-shadow:0 4px 0 var(--accent-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-d)}
.btn.good{background:var(--good);color:var(--surface);box-shadow:0 4px 0 var(--good-d)}
.btn.good:active{box-shadow:0 0 0 var(--good-d)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.link{color:var(--accent);font-weight:700;font-size:14.5px;padding:8px 0}
.link.quiet{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;flex:none}
.chip.fire{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.fire.off{color:var(--muted);background:var(--surface);border-color:var(--line)}

/* Maskottchen mit Sprechblase */
.say{display:flex;align-items:flex-end;gap:10px}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:600;flex:1;min-width:0;text-wrap:pretty}
.mascot{width:96px;height:96px;flex:none;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot.sm{width:64px;height:64px}
.mascot.lg{width:150px;height:150px;animation:jump .7s ease-in-out 4, bob 2.6s ease-in-out 2.8s infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.92)}45%{transform:translateY(-26px) scale(.96,1.06)}}

.week{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--good);border-color:var(--good)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.four{grid-template-columns:repeat(4,1fr)}
/* Cardio: Auswahl der Aktivität */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:52px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:left;line-height:1.2}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.step.big{grid-template-columns:52px minmax(0,1fr) 52px}
.step.big input{font-size:22px}
.field{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 17px var(--body);padding:0 14px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist b{display:block;font-weight:600}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0;padding-top:4px}
.plan .name{font-weight:600;min-width:0}
.plan .target{font-weight:700;text-align:right;white-space:nowrap}
.plan .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;align-items:center}
details summary{cursor:pointer;color:var(--muted);font-size:14.5px;font-weight:700;padding:6px 0}
.cue{font-size:14.5px;color:var(--muted);padding-top:4px}

/* Training: eine Übung, ein Satz */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:22px;height:22px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--good);border-radius:7px;transition:width .4s cubic-bezier(.2,1.4,.4,1);position:relative}
.bar i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:2px;background:var(--surface);opacity:.35}
.goal .bar i{background:var(--accent)}
.pips{display:flex;gap:6px}
.pip{flex:1;max-width:56px;height:8px;border-radius:4px;background:var(--line)}
.pip.on{background:var(--good)}
.pip.cur{background:var(--accent)}
.rest{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-soft);border-radius:var(--r);padding:10px 16px}
.timer{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.coach{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.sethead,.set{display:grid;grid-template-columns:20px 1fr 1fr 48px;gap:8px;align-items:center}
.sethead{padding:0 8px}
.sethead span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.set{padding:6px;border-radius:14px;border:2px solid var(--line)}
.set .idx{text-align:center;font-weight:700;color:var(--muted)}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;background:var(--bg);border-radius:10px}
.step button{height:44px;font-size:20px;font-weight:700;color:var(--accent)}
.step input{width:100%;min-width:0;height:44px;border:0;background:transparent;color:var(--ink);text-align:center;font:700 17px var(--body);font-variant-numeric:tabular-nums;padding:0}
.check{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;color:transparent;transition:transform .06s}
.check:active{transform:translateY(3px)}
.check svg{width:22px;height:22px}
.set.done{background:var(--good-soft);border-color:transparent}
.set.done .check{background:var(--good);border-color:var(--good);box-shadow:0 3px 0 var(--good-d);color:var(--surface);animation:tickpop .3s ease-out}
.set.done .step{background:transparent}
@keyframes tickpop{50%{transform:scale(1.2)}}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dock .in{max-width:520px;margin:0 auto}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tabs button{min-height:48px;border-radius:14px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:800 26px var(--display);font-variant-numeric:tabular-nums}
.spark{width:100%;height:56px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--accent-soft);stroke:none}
.spark .pt{fill:var(--accent)}
.spark .gr{stroke:var(--line);stroke-width:1;fill:none}
.prize{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.prize svg{width:24px;height:24px}
.prize.won{background:var(--warn);color:var(--surface)}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
.node{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--display);font-variant-numeric:tabular-nums;background:var(--bg);border:3px solid var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.node svg{width:26px;height:26px}
.node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-d)}
.node.now{border-color:var(--accent);color:var(--accent);background:var(--surface);box-shadow:0 0 0 6px var(--accent-soft);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft)}50%{box-shadow:0 0 0 10px var(--accent-soft)}}
.node.prizeN{width:84px;height:84px;background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.node.prizeN svg{width:40px;height:40px}
.node.prizeN.won{background:var(--warn);color:var(--surface)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.2;min-width:0}
.bdg i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
.bdg i svg{width:26px;height:26px}
.bdg span{font-weight:400;color:var(--muted);font-size:11.5px}
.bdg.off{color:var(--muted)}
.bdg.off i{background:var(--bg);color:var(--muted);opacity:.55}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,10,18,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet .card{width:100%;max-width:520px;animation:pop .2s ease-out}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
#toast{position:fixed;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom, 0px));z-index:9;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
#toast div{background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:999px;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.xpfloat{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:9;text-align:center;pointer-events:none;font:800 24px var(--display);color:var(--good);animation:rise .9s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.enter{animation:pop .25s ease-out}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.mascot,.mascot.lg,.node.now,#toast div,.enter,.sheet .card{animation:none}.xpfloat{animation-duration:.01s}}
</style>

<div id="app"></div>
<div id="dock" class="dock"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";

/* ---------- Übungen ---------- */
// step = kleinste sinnvolle Steigerung in kg, start = vorsichtiges Startgewicht, rest = Pause in Sekunden
var EX = {
  hipthrust:{n:"Hip Thrust",eq:"Langhantel",step:5,start:30,rest:120,cue:"Schulterblätter auf die Bank, Kinn Richtung Brust. Füße so stellen, dass die Schienbeine oben senkrecht stehen. Oben 1 Sekunde den Po fest anspannen, nicht ins Hohlkreuz drücken."},
  glutebridge:{n:"Glute Bridge an der Maschine",eq:"Maschine",step:5,start:30,rest:120,cue:"Rücken flach, Becken leicht nach hinten kippen. Über die Fersen hochdrücken und oben 1 Sekunde halten."},
  rdl:{n:"Rumänisches Kreuzheben",eq:"Langhantel",step:2.5,start:20,rest:120,cue:"Knie leicht gebeugt, Po weit nach hinten schieben, Hantel dicht an den Beinen. Runter bis du die Dehnung hinten im Oberschenkel spürst, Rücken bleibt gerade."},
  rdl_kh:{n:"Kreuzheben mit Kurzhanteln",eq:"Kurzhanteln",hand:1,step:2,start:8,rest:120,cue:"Wie rumänisches Kreuzheben: Po nach hinten, Hanteln dicht an den Beinen, Rücken gerade."},
  bss:{n:"Bulgarian Split Squat",eq:"Kurzhanteln",hand:1,side:1,step:1,start:4,rest:90,cue:"Hinteren Fuß auf die Bank, großer Schritt nach vorn. Oberkörper leicht vorlehnen und über die vordere Ferse hochdrücken. So trifft es den Po statt den Oberschenkel."},
  revlunge:{n:"Ausfallschritt rückwärts",eq:"Kurzhanteln",hand:1,side:1,step:1,start:4,rest:90,cue:"Großer Schritt nach hinten, Gewicht bleibt auf der vorderen Ferse. Oberkörper leicht vorlehnen."},
  abd:{n:"Abduktoren-Maschine",eq:"Maschine",step:5,start:25,rest:75,cue:"Oberkörper leicht nach vorn lehnen, Knie kontrolliert nach außen drücken, außen kurz halten und langsam zurück."},
  abd_kabel:{n:"Abduktion am Kabel",eq:"Kabelzug",side:1,step:2.5,start:5,rest:75,cue:"Seitlich zum Kabel stehen, Bein gestreckt zur Seite führen, Hüfte bleibt ruhig."},
  lat:{n:"Latzug",eq:"Kabelzug",step:2.5,start:25,rest:90,cue:"Brust raus, Stange zur oberen Brust ziehen, Ellenbogen Richtung Hosentaschen. Nicht mit Schwung."},
  pullup:{n:"Klimmzug mit Unterstützung",eq:"Maschine",step:5,start:40,rest:90,cue:"Hier gilt umgekehrt: weniger Unterstützung ist schwerer. Trage das Unterstützungsgewicht ein und reduziere es, wenn du alle Sätze schaffst.",inv:1},
  squat:{n:"Kniebeuge",eq:"Langhantel",step:2.5,start:20,rest:150,cue:"Füße etwas breiter als hüftbreit, Zehen leicht nach außen. Tief gehen, Knie folgen den Zehen, Brust bleibt oben."},
  goblet:{n:"Goblet Squat",eq:"Kurzhantel",step:2,start:8,rest:120,cue:"Hantel vor der Brust halten, tief in die Hocke, Ellenbogen zwischen die Knie."},
  legcurl:{n:"Beinbeuger liegend",eq:"Maschine",step:2.5,start:15,rest:75,cue:"Hüfte bleibt auf dem Polster. Zügig hoch, 3 Sekunden langsam ablassen."},
  legcurl_s:{n:"Beinbeuger sitzend",eq:"Maschine",step:2.5,start:20,rest:75,cue:"Oberkörper leicht nach vorn, Fersen kräftig unter den Sitz ziehen, langsam zurück."},
  legext:{n:"Beinstrecker",eq:"Maschine",step:2.5,start:15,rest:75,cue:"Rücken fest an die Lehne, Polster knapp über dem Fuß. Beine ganz strecken, oben 1 Sekunde halten, 3 Sekunden langsam ablassen. Kein Schwung."},
  legext_1:{n:"Beinstrecker einbeinig",eq:"Maschine",side:1,step:2.5,start:7.5,rest:60,cue:"Ein Bein nach dem anderen. Ganz strecken, oben kurz halten, langsam ablassen."},
  kickback:{n:"Kickback am Kabel",eq:"Kabelzug",side:1,step:2.5,start:5,rest:60,cue:"Leicht vorgebeugt abstützen, Bein aus der Hüfte nach hinten oben führen. Kein Schwung aus dem Rücken."},
  kickback_m:{n:"Kickback an der Maschine",eq:"Maschine",side:1,step:5,start:15,rest:60,cue:"Über die Ferse nach hinten drücken, oben kurz den Po anspannen."},
  ohp:{n:"Schulterdrücken",eq:"Kurzhanteln",hand:1,step:1,start:4,rest:90,cue:"Sitzend, Rücken angelehnt. Hanteln von Ohrhöhe gerade nach oben drücken, Bauch fest."},
  ohp_m:{n:"Schulterpresse",eq:"Maschine",step:2.5,start:10,rest:90,cue:"Griffe von Ohrhöhe nach oben drücken, Schultern nicht zu den Ohren ziehen."},
  row:{n:"Rudern am Kabel",eq:"Kabelzug",step:2.5,start:20,rest:90,cue:"Aufrecht sitzen, Griff zum Bauchnabel ziehen, Schulterblätter hinten zusammen. Oberkörper schwingt nicht mit."},
  row_kh:{n:"Kurzhantel-Rudern",eq:"Kurzhantel",side:1,step:1,start:6,rest:90,cue:"Eine Hand auf der Bank abstützen, Hantel zur Hüfte ziehen, Ellenbogen dicht am Körper."},
  legpress:{n:"Beinpresse, Füße hoch und breit",eq:"Maschine",step:5,start:40,rest:120,cue:"Füße hoch und breit auf die Platte, damit der Po arbeitet. Tief ablassen, ohne dass der untere Rücken sich vom Polster hebt. Knie oben nicht durchstrecken."},
  hack:{n:"Kniebeuge an der Multipresse",eq:"Multipresse",step:2.5,start:20,rest:120,cue:"Füße etwas vor die Stange stellen, tief gehen, über die Fersen hochdrücken."},
  lunge:{n:"Ausfallschritte im Gehen",eq:"Kurzhanteln",hand:1,side:1,step:1,start:4,rest:90,cue:"Große Schritte, Oberkörper leicht vor, aus der vorderen Ferse hochdrücken."},
  stepup:{n:"Step-up auf die Bank",eq:"Kurzhanteln",hand:1,side:1,step:1,start:4,rest:90,cue:"Ganzen Fuß auf die Bank, nur mit dem oberen Bein hochdrücken, 3 Sekunden langsam ablassen."},
  hyper:{n:"Hyperextension für den Po",eq:"Rückenstrecker",step:2.5,start:0,rest:75,cue:"Polster unter die Hüfte, Füße leicht nach außen drehen, oberen Rücken rund lassen. Aus dem Po hochkommen und oben fest anspannen. 0 kg heißt ohne Zusatzgewicht."},

var ORDER = ["A","B","C"];
// Cardio ist ein eigener Trainingstag ("K"). Er zählt fürs Wochenziel, verschiebt aber die Reihenfolge A, B, C nicht.
var CARDIO = {
  laufband:{n:"Laufband",tip:"Stell 8 bis 12 % Steigung ein und geh zügig. Nicht am Geländer festhalten, dann arbeitet der Po mit."},
  crosstrainer:{n:"Crosstrainer",tip:"Aufrecht stehen und den Druck über die Fersen geben. Ab und zu rückwärts treten, dann spürst du den Po mehr."},
  rad:{n:"Fahrrad-Ergometer",tip:"Sattel so hoch, dass das Knie unten fast gestreckt ist. Lieber gleichmäßig treten als kurz zu schnell."},

var LVL = {l:["Locker","Du kannst dich dabei noch gut unterhalten."],m:["Mittel","Reden geht nur noch in kurzen Sätzen."],h:["Intensiv","Reden fällt dir schwer."]};
var KEY = "pocoach.v1";

/* ---------- Speicher ---------- */
var storageOk = true;
var state = {v:1,sessions:[],swaps:{},draft:null,reward:0,backupAt:0};
function load(){
  // Einmaliger Neustart: die Test-Einträge der ersten Version werden beiseitegelegt, alle fangen bei null an.
  try{
    if(!localStorage.getItem(KEY+".reset1")){
      var old = localStorage.getItem(KEY);
      if(old) localStorage.setItem(KEY+".old", old);
      localStorage.removeItem(KEY);
      localStorage.setItem(KEY+".reset1","1");
    }
  }catch(e){}
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var s = clean(JSON.parse(raw)); if(s) state = s; }
  }catch(e){ storageOk = false; }
  try{ localStorage.setItem(KEY+".t","1"); }catch(e){ storageOk = false; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ storageOk = false; }
  if(state.sessions.length || state.draft) keepData();
}
// Bittet den Browser, die Einträge nicht von selbst aufzuräumen (einmal pro Start, sobald es etwas zu schützen gibt)
var keepAsked = false;
function keepData(){
  if(keepAsked) return; keepAsked = true;
  try{
    var st = navigator.storage; if(!st || !st.persist || !st.persisted) return;
    st.persisted().then(function(p){ if(!p) return st.persist(); }).catch(function(){});
  }catch(e){}
}
function numOr(x,d){ x = Number(x); return isFinite(x) && x >= 0 ? x : d; }
// nimmt nur bekannte Felder und Zahlen an
function clean(s){
  if(!s || typeof s !== "object" || !Array.isArray(s.sessions)) return null;
  var out = {v:1,sessions:[],swaps:{},draft:null,reward:numOr(s.reward,0),backupAt:numOr(s.backupAt,0)};
  s.sessions.forEach(function(x){
    if(!x) return;
    var t = Number(x.date); if(!isFinite(t)) return;
    if(x.day === "K"){
      var c = x.cardio, m = Math.round(numOr(c && c.min,0));
      if(c && CARDIO[c.act] && LVL[c.lvl] && m > 0) out.sessions.push({date:t,day:"K",entries:[],cardio:{act:c.act,min:m,lvl:c.lvl}});
      return;
    }
    if(!DAYS[x.day] || !Array.isArray(x.entries)) return;
    var entries = [];
    x.entries.forEach(function(e){
      if(!e || !EX[e.ex] || !Array.isArray(e.sets)) return;
      var sets = e.sets.map(function(z){ return {w:numOr(z && z.w,0), r:Math.round(numOr(z && z.r,0))}; }).filter(function(z){ return z.r > 0; });
      if(sets.length) entries.push({ex:e.ex,sets:sets});
    });
    if(entries.length) out.sessions.push({date:t,day:x.day,entries:entries});
  });
  out.sessions.sort(function(a,b){ return a.date - b.date; });
  if(s.swaps && typeof s.swaps === "object"){
    Object.keys(s.swaps).forEach(function(k){ if(EX[s.swaps[k]]) out.swaps[k] = s.swaps[k]; });
  }
  var d = s.draft;
  if(d && d.day === "K" && d.cardio && CARDIO[d.cardio.act]){
    out.draft = {day:"K",start:numOr(d.start,Date.now()),restEnd:0,items:[],
      cardio:{act:d.cardio.act,min:Math.max(5,Math.round(numOr(d.cardio.min,30))),lvl:LVL[d.cardio.lvl]?d.cardio.lvl:"m",hit:!!d.cardio.hit}};
    if(numOr(d.past,0)) out.draft.past = numOr(d.past,0);
  }
  else if(d && DAYS[d.day] && Array.isArray(d.items)){
    var items = [];
    d.items.forEach(function(it){
      if(!it || !EX[it.ex] || !Array.isArray(it.sets)) return;
      items.push({ex:it.ex,min:numOr(it.min,8),max:numOr(it.max,12),kind:String(it.kind||"start"),w:numOr(it.w,0),
        sets:it.sets.map(function(z){ return {w:numOr(z && z.w,0), r:Math.round(numOr(z && z.r,0)), done:!!(z && z.done), skip:!!(z && z.skip)}; })});
    });
    if(items.length) out.draft = {day:d.day,start:numOr(d.start,Date.now()),restEnd:numOr(d.restEnd,0),items:items};
    if(items.length && numOr(d.past,0)) out.draft.past = numOr(d.past,0);
  }
  return out;
}

/* ---------- Sicherung als Link ---------- */
// Alle Trainings stecken komprimiert hinter dem # im Link. Dieser Teil wird nie an den Server geschickt.
var BK = "#sicherung=";
function packState(){
  return {v:2,
    s:state.sessions.map(function(x){
      var t = Math.floor(x.date/1000);
      if(x.cardio) return [t,"K",x.cardio.act,x.cardio.min,x.cardio.lvl];
      return [t,x.day,x.entries.map(function(e){ var a = [e.ex]; e.sets.forEach(function(z){ a.push(z.w,z.r); }); return a; })];
    }),
    w:state.swaps, r:state.reward ? Math.floor(state.reward/1000) : 0};
}
function unpack(o){
  if(!o || o.v !== 2 || !Array.isArray(o.s)) return null;
  var sessions = o.s.map(function(a){
    if(!Array.isArray(a)) return null;
    if(a[1] === "K") return {date:a[0]*1000,day:"K",entries:[],cardio:{act:a[2],min:a[3],lvl:a[4]}};
    return {date:a[0]*1000,day:a[1],entries:(Array.isArray(a[2])?a[2]:[]).map(function(e){
      var sets = []; if(Array.isArray(e)) for(var i=1;i+1<e.length;i+=2) sets.push({w:e[i],r:e[i+1]});
      return {ex:Array.isArray(e)?e[0]:"",sets:sets};
    })};
  });
  return clean({sessions:sessions,swaps:o.w||{},reward:(o.r||0)*1000});
}
function b64(bytes){
  var str = "", i; for(i=0;i<bytes.length;i+=8192) str += String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
  return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64(t){
  t = t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length % 4) t += "=";
  var str = atob(t), a = new Uint8Array(str.length); for(var i=0;i<str.length;i++) a[i] = str.charCodeAt(i); return a;
}
function makeLink(){
  var json = JSON.stringify(packState()), base = location.href.split("#")[0];
  if(window.CompressionStream && window.Response && window.Blob){
    return new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()
      .then(function(buf){ return base + BK + "z" + b64(new Uint8Array(buf)); });
  }
  return Promise.resolve(base + BK + "j" + b64(new TextEncoder().encode(json)));
}
// liest einen Sicherungs-Link und gibt die geprüften Daten zurück
function readLink(str){
  return new Promise(function(ok,fail){
    var m = /#sicherung=([zj])([A-Za-z0-9_-]+)/.exec(String(str || "")); if(!m) return fail();
    var bytes = unb64(m[2]);
    if(m[1] === "j") return ok(new TextDecoder().decode(bytes));
    if(!window.DecompressionStream) return fail();
    new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text().then(ok, fail);
  }).then(function(txt){ var b = unpack(JSON.parse(txt)); if(!b) throw new Error("leer"); return b; });
}
// fügt fehlende Trainings aus der Sicherung hinzu, löscht nichts
function mergeIn(b){
  var have = {}, added = 0;
  state.sessions.forEach(function(x){ have[Math.floor(x.date/1000)] = 1; });
  b.sessions.forEach(function(x){ if(!have[Math.floor(x.date/1000)]){ state.sessions.push(x); added++; } });
  state.sessions.sort(function(a,c){ return a.date - c.date; });
  if(!state.reward && b.reward) state.reward = b.reward;
  Object.keys(b.swaps).forEach(function(k){ if(!state.swaps[k]) state.swaps[k] = b.swaps[k]; });
  save(); return added;
}
function backupDue(){ return state.sessions.length > 0 && Date.now() - (state.backupAt || 0) > 7*864e5; }
var bkUrl = "";
// Link vorbereiten, damit das Teilen-Menü beim Tippen sofort aufgeht
function prepBackup(){
  if(!state.sessions.length || !document.querySelector('[data-act="backup"]')) return;
  makeLink().then(function(u){ bkUrl = u; }).catch(function(){ bkUrl = ""; });
}
function backupDone(msg){
  state.backupAt = Date.now(); save(); toast(msg);
  if(ui.summary) ui.summary.backupDue = false;
  render();
}
function shareBackup(){
  if(!bkUrl){ toast("Einen Moment, der Link wird erstellt."); prepBackup(); return; }
  var url = bkUrl, n = state.sessions.length;
  var text = "Meine Pro-Trainer-Sicherung vom "+dateStr(Date.now())+" ("+n+(n===1?" Training":" Trainings")+"). Zum Wiederherstellen den Link öffnen.";
  if(navigator.share){
    navigator.share({title:"Pro-Trainer Sicherung",text:text,url:url}).then(function(){ backupDone("Sicherung geteilt."); })
      .catch(function(e){ if(!e || e.name !== "AbortError") copyBackup(url); });
  } else copyBackup(url);
}
function copyBackup(url){
  var show = function(){
    sheet.className = "sheet"; sheet.hidden = false;
    sheet.innerHTML = '<div class="card stack" role="dialog" aria-modal="true" aria-label="Sicherungs-Link"><h2>Sicherungs-Link</h2><p class="muted">Lange auf den Text drücken, Kopieren wählen und dir den Link zum Beispiel per WhatsApp oder Mail schicken.</p>' +
      '<textarea class="field" id="bkOut" readonly style="min-height:120px;padding:10px;font-size:13px">'+url+'</textarea>' +
      '<button class="btn" data-act="bkCopied">Habe ich kopiert</button><button class="btn ghost" data-act="closeSheet">Schließen</button></div>';
    var o = document.getElementById("bkOut"); if(o){ o.focus(); o.select(); }
  };
  try{ navigator.clipboard.writeText(url).then(function(){ backupDone("Link kopiert. Schick ihn dir zum Beispiel per WhatsApp oder Mail."); }, show); }catch(e){ show(); }
}
function offerRestore(b){
  if(!b.sessions.length){ toast("In dieser Sicherung sind keine Trainings."); return; }
  ui.restore = b;
  var last = b.sessions[b.sessions.length-1], n = b.sessions.length, m = state.sessions.length;
  sheet.className = "sheet"; sheet.hidden = false;
  sheet.innerHTML = '<div class="card stack" role="dialog" aria-modal="true" aria-label="Sicherung einspielen"><h2>Sicherung gefunden</h2>' +
    '<p class="muted">Darin: '+n+(n===1?' Training':' Trainings')+' (das letzte am '+dateStr(last.date)+'). Auf diesem Gerät '+(m===1?'ist':'sind')+' gerade '+m+' gespeichert.</p>' +
    '<p class="muted">Beim Einspielen kommen fehlende Trainings dazu. Es wird nichts gelöscht. Spiel nur deine eigene Sicherung ein.</p>' +
    '<button class="btn" data-act="restoreOk">Einspielen</button><button class="btn ghost" data-act="closeSheet">Nicht einspielen</button></div>';
}
function checkHash(){
  if(location.hash.indexOf(BK) !== 0) return;
  var h = location.hash;
  try{ history.replaceState(null, "", location.href.split("#")[0]); }catch(e){}
  readLink(h).then(offerRestore, function(){ toast("Dieser Sicherungs-Link ist unvollständig oder beschädigt."); });
}

/* ---------- Trainer-Logik ---------- */
function hist(ex){
  var h = [];
  state.sessions.forEach(function(s){ s.entries.forEach(function(e){ if(e.ex === ex) h.push({date:s.date,sets:e.sets}); }); });
  return h;
}
function topW(sets){ return sets.reduce(function(m,s){ return Math.max(m,s.w); },0); }
function total(sets){ return sets.reduce(function(m,s){ return m + s.r; },0); }
function best(sets){ return sets.reduce(function(b,s){ return (!b || s.w > b.w || (s.w === b.w && s.r > b.r)) ? s : b; },null); }
function roundStep(x,step){ return Math.max(0, Math.round(x/step)*step); }

// Doppelte Progression: erst Wiederholungen bis zum oberen Ende steigern, dann Gewicht erhöhen.
function recommend(ex,slot){
  var e = EX[ex], h = hist(ex), n = slot.sets, i, t = [];
  if(!h.length){
    for(i=0;i<n;i++) t.push(slot.min);
    return {kind:"start",w:e.start,targets:t};
  }
  var last = h[h.length-1], lw = topW(last.sets), reps = last.sets.map(function(s){return s.r;});
  var allMax = reps.length >= Math.min(2,n) && reps.every(function(r){ return r >= slot.max; });
  var dir = e.inv ? -1 : 1; // bei Unterstützung ist weniger Gewicht schwerer
  if(allMax){
    for(i=0;i<n;i++) t.push(slot.min);
    return {kind:"up",w:Math.max(0,lw + dir*e.step),targets:t};
  }
  if(reps[0] < slot.min){
    for(i=0;i<n;i++) t.push(slot.min);
    return {kind:"down",w:Math.max(0,lw - dir*e.step),targets:t};
  }
  if(h.length >= 3){
    var a = h[h.length-3], b = h[h.length-2];
    if(topW(a.sets) === lw && topW(b.sets) === lw && total(last.sets) <= total(a.sets)){
      var mid = Math.round((slot.min + slot.max)/2);
      for(i=0;i<n;i++) t.push(mid);
      var dw = e.inv ? lw + e.step : roundStep(lw*0.9, e.step);
      if(dw === lw && !e.inv) dw = Math.max(0, lw - e.step);
      return {kind:"reset",w:dw,targets:t};
    }
  }
  for(i=0;i<n;i++){
    var prev = reps[Math.min(i,reps.length-1)];
    t.push(Math.max(slot.min, Math.min(slot.max, prev + 1)));
  }
  return {kind:"reps",w:lw,targets:t};
}
function coachText(it){
  var e = EX[it.ex];
  if(it.kind === "start") return "Erstes Mal! Nimm ein Gewicht, mit dem du " + it.min + " saubere Wiederholungen schaffst und noch 2 übrig hättest.";
  if(it.kind === "up") return "Heute mehr Gewicht: " + kg(it.w,e) + ". Letztes Mal hast du alle Sätze voll geschafft.";
  if(it.kind === "down") return "Heute etwas leichter: " + kg(it.w,e) + ". So bleibt deine Technik sauber.";
  if(it.kind === "reset") return "Heute " + kg(it.w,e) + ". Wir nehmen neu Anlauf, danach geht es wieder hoch.";
  return "Gleiches Gewicht wie letztes Mal. Versuch pro Satz eine Wiederholung mehr.";
}

/* ---------- Helfer ---------- */
function de(n){ return Number(n).toLocaleString("de-DE",{maximumFractionDigits:2}); }
function kg(w,e){ if(!w) return "ohne Gewicht"; return de(w) + " kg" + (e && e.hand ? " je Hand" : ""); }
function chosen(slot){ var c = state.swaps[slot.id]; return slot.opts.indexOf(c) >= 0 ? c : slot.opts[0]; }
function nextDay(){
  var s = state.sessions.filter(function(x){ return x.day !== "K"; }); if(!s.length) return "A";
  return ORDER[(ORDER.indexOf(s[s.length-1].day)+1) % 3];
}
function cardioList(){ return state.sessions.filter(function(x){ return x.cardio; }); }
function cardioMins(list){ return (list || cardioList()).reduce(function(m,x){ return m + x.cardio.min; },0); }
function isCardio(){ return !!(state.draft && state.draft.day === "K"); }
function isPast(){ return !!(state.draft && state.draft.past); }
// welcher Krafttag an einem Datum dran gewesen wäre (nach den Trainings davor)
function dayAt(t){
  var s = state.sessions.filter(function(x){ return x.day !== "K" && x.date < t; }); if(!s.length) return "A";
  return ORDER[(ORDER.indexOf(s[s.length-1].day)+1) % 3];
}
function isoDay(t){ var d = new Date(t); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
// Datum aus dem Kalenderfeld: Mittag des Tages, heute höchstens jetzt
function pastTime(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); if(!m) return 0;
  var t = new Date(+m[1], +m[2]-1, +m[3], 12).getTime();
  if(dayKey(t) === dayKey(Date.now())) return Math.min(t, Date.now());
  return t > Date.now() ? 0 : t;
}
function sessionLabel(s){
  if(s.cardio) return "Cardio · "+CARDIO[s.cardio.act].n;
  return "Tag "+s.day+" · "+DAYS[s.day].title;
}
function sessionMeta(s){
  if(s.cardio) return s.cardio.min+" Min. · "+LVL[s.cardio.lvl][0];
  var n = s.entries.reduce(function(m,e){ return m + e.sets.length; },0);
  return n+(n===1?" Satz":" Sätze")+" · "+s.entries.length+(s.entries.length===1?" Übung":" Übungen");
}
function monday(t){ var d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); }
function dayKey(t){ var d = new Date(t); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
// Trainingstage in der Woche, die an diesem Montag beginnt (zwei Trainings am selben Tag zählen einmal)
function daysIn(m){
  var seen = {}, n = 0;
  state.sessions.forEach(function(s){ if(monday(s.date) === m){ var k = dayKey(s.date); if(!seen[k]){ seen[k] = 1; n++; } } });
  return n;
}
function weekCount(){ return daysIn(monday(Date.now())); }
function prevMon(m){ return monday(m - 3*864e5); }
function nextMon(m){ return monday(m + 8*864e5); }
// volle Wochen in Folge; die laufende Woche zählt, sobald sie voll ist, und unterbricht vorher nichts
function streak(){
  var m = monday(Date.now()), n = 0;
  if(daysIn(m) >= 3) n++;
  for(var a = prevMon(m); daysIn(a) >= 3; a = prevMon(a)) n++;
  return n;
}
function weekStats(){
  var full = 0, best = 0, run = 0;
  if(!state.sessions.length) return {full:0,best:0};
  var m = monday(Date.now());
  for(var a = monday(state.sessions[0].date); a <= m; a = nextMon(a)){
    if(daysIn(a) >= 3){ full++; run++; if(run > best) best = run; } else run = 0;
  }
  return {full:full,best:best};
}
function totalSets(){ return state.sessions.reduce(function(m,s){ return m + s.entries.reduce(function(k,e){ return k + e.sets.length; },0); },0); }
// 10 XP pro Satz, 3 pro Cardio-Minute, 50 pro Training, 100 pro voller Woche
function xp(){ return totalSets()*10 + cardioMins()*3 + state.sessions.length*50 + weekStats().full*100; }
var LEVELS = [[0,"Einsteigerin"],[400,"Dranbleiberin"],[1200,"Kraftpaket"],[2400,"Powerfrau"],[4000,"Maschine"],[6000,"Ikone"],[9000,"Legende"]];
function level(x){
  var i = 0; while(i < LEVELS.length-1 && x >= LEVELS[i+1][0]) i++;

  return {n:i+1,title:LEVELS[i][1],hi:hi,next:hi?LEVELS[i+1][1]:"",pct:hi?(x-lo)/(hi-lo)*100:100};
}

function xpFloat(txt){
  try{

    setTimeout(function(){ d.remove(); }, 950);
  }catch(e){}

var ac = null;
function tone(freqs,dur){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    ac = ac || new AC(); if(ac.state === "suspended") ac.resume();
    freqs.forEach(function(f,k){
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + k*0.09;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
    });
  }catch(e){}
}
function confetti(n){
  try{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv);
    var ctx = cv.getContext("2d"), W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
    var cs = getComputedStyle(document.documentElement), cols = ["--accent","--good","--warn","--peach"].map(function(v){ return cs.getPropertyValue(v).trim(); });
    var ps = [], t0 = Date.now(), i;
    for(i=0;i<n;i++) ps.push({x:Math.random()*W,y:-Math.random()*H*0.6,vx:(Math.random()-0.5)*3,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,c:cols[i%cols.length]});
    (function frame(){
      var el = Date.now() - t0; ctx.clearRect(0,0,W,H);
      ps.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.r += 0.15; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0,1-el/3000); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); ctx.restore(); });
      if(el < 3000) requestAnimationFrame(frame); else cv.remove();
    })();
  }catch(e){}
}
function countUp(id,to){
  try{
    var el = document.getElementById(id), t0 = Date.now(); if(!el || !window.requestAnimationFrame) return;
    (function f(){ var p = Math.min(1,(Date.now()-t0)/900); el.textContent = "+" + de(Math.round(to*p)) + " XP"; if(p < 1) requestAnimationFrame(f); })();
  }catch(e){}
}

function startDraft(day,past){
  var items = DAYS[day].slots.map(function(slot){
    var ex = chosen(slot), r = recommend(ex,slot);
    if(past){
      // Nachtragen: Werte vom letzten Mal davor vorschlagen, alle Sätze schon abgehakt
      var h = hist(ex).filter(function(x){ return x.date < past; }), last = h.length ? h[h.length-1].sets : null, sets = [];
      for(var i=0;i<slot.sets;i++){
        var z = last ? last[Math.min(i,last.length-1)] : null;
        sets.push({w:z ? z.w : EX[ex].start, r:z ? z.r : slot.min, done:true, skip:false});
      }
      return {ex:ex,min:slot.min,max:slot.max,kind:"past",w:sets[0].w,sets:sets};
    }
    return {ex:ex,min:slot.min,max:slot.max,kind:r.kind,w:r.w,
      sets:r.targets.map(function(t){ return {w:r.w,r:t,done:false,skip:false}; })};
  });
  state.draft = {day:day,start:Date.now(),restEnd:0,items:items};
  if(past){ state.draft.past = past; save(); render(); window.scrollTo(0,0); return; }
  save(); wake(); render(); window.scrollTo(0,0);
}
function counts(){ var d=0,h=0,t=0; state.draft.items.forEach(function(it){ it.sets.forEach(function(s){ t++; if(s.done) d++; if(s.done||s.skip) h++; }); }); return {done:d,handled:h,total:t}; }

function cardioTick(){

  var c = state.draft.cardio, sec = cardioSec(), t = document.getElementById("cTime"), p = document.getElementById("prog"), b = document.getElementById("progbar");

function finishCardio(m){

function addSession(x){ state.sessions.push(x); state.sessions.sort(function(a,b){ return a.date - b.date; }); }
function finish(){
  var dr = state.draft, entries = [], records = [], sets = 0, vol = 0;
  dr.items.forEach(function(it){
    var done = it.sets.filter(function(s){ return s.done && s.r > 0; }).map(function(s){ return {w:s.w,r:s.r}; });
    if(!done.length) return;
    var e = EX[it.ex], h = hist(it.ex), nb = best(done);
    if(h.length){
      var pb = best([].concat.apply([],h.map(function(x){return x.sets;})));
      var better = e.inv ? (nb.w < pb.w || (nb.w === pb.w && nb.r > pb.r)) : (nb.w > pb.w || (nb.w === pb.w && nb.r > pb.r));
      if(better) records.push(e.n + ": " + kg(nb.w,e) + " × " + nb.r);
    }
    done.forEach(function(s){ sets++; vol += s.w * s.r * (e.hand?2:1); });

function spark(vals){
  var W = 300, H = 56, p = 6, min = Math.min.apply(null,vals), max = Math.max.apply(null,vals), span = max - min || 1;
  var pts = vals.map(function(v,i){
    var x = vals.length === 1 ? W/2 : p + i*(W-2*p)/(vals.length-1);
    var y = max === min ? H/2 : H - p - (v-min)/span*(H-2*p);
    return [Math.round(x*10)/10, Math.round(y*10)/10];
  });
  var line = pts.map(function(q){ return q.join(","); }).join(" "), lastP = pts[pts.length-1];
  var s = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path class="gr" d="M0 '+(H-1)+'H'+W+'"/>';
  if(pts.length > 1) s += '<polygon class="ar" points="'+pts[0][0]+','+H+' '+line+' '+lastP[0]+','+H+'"/><polyline class="ln" points="'+line+'"/>';
  return s + '<circle class="pt" cx="'+lastP[0]+'" cy="'+lastP[1]+'" r="4"/></svg>';
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",function(ev){

  switch(act){
    case "tab": ui.tab = el.dataset.tab; render(); window.scrollTo(0,0); break;
    case "day": ui.day = el.dataset.day; ui.planOpen = true; render(); break;
    case "swap":
      var slot = null; ORDER.forEach(function(k){ DAYS[k].slots.forEach(function(y){ if(y.id === el.dataset.slot) slot = y; }); });
      if(slot){ state.swaps[slot.id] = slot.opts[(slot.opts.indexOf(chosen(slot))+1) % slot.opts.length]; ui.planOpen = true; save(); render(); }
      break;
    case "start": startDraft(el.dataset.day); break;
    case "startCardio": startCardio(); break;
    case "pastOpen":
      var y = Date.now() - 864e5; ui.past = {date:isoDay(y),day:dayAt(pastTime(isoDay(y))),manual:false}; pastSheet(); break;
    case "pastDay": ui.past.day = el.dataset.day; ui.past.manual = true; pastSheet(); break;
    case "pastGo":
      var pt = pastTime(ui.past.date); if(!pt){ toast("Bitte ein Datum bis heute wählen."); break; }

      if(ui.past.day === "K") startCardio(pt); else startDraft(ui.past.day, pt);
      break;
    case "histAll": ui.histAll = !ui.histAll; render(); break;
    case "backup": shareBackup(); break;
    case "bkCopied": closeSheet(); backupDone("Gut, jetzt den Link an dich schicken."); break;
    case "restorePaste":
      var ri = document.getElementById("restoreIn");
      readLink(ri ? ri.value : "").then(offerRestore, function(){ toast("Das ist kein vollständiger Sicherungs-Link."); });
      break;
    case "restoreOk":
      var added = ui.restore ? mergeIn(ui.restore) : 0; ui.restore = null; closeSheet(); render();
      toast(added ? added+(added===1?" Training":" Trainings")+" wiederhergestellt." : "Alle Trainings waren schon da.");
      break;
    case "delAsk":
      var ds = null; state.sessions.forEach(function(x){ if(String(x.date) === el.dataset.t) ds = x; });
      if(ds){ ui.del = ds.date; openSheet("Training löschen?", sessionLabel(ds)+" vom "+dateStr(ds.date)+" wird endgültig gelöscht.", "Löschen", "delNow", "Behalten"); }

    case "delNow":

    case "cAct": state.draft.cardio.act = el.dataset.k; save(); render(); break;
    case "cLvl": state.draft.cardio.lvl = el.dataset.k; save(); render(); break;
    case "cMin": setCardioMin(state.draft.cardio.min + (+el.dataset.d)); break;
    case "cSave": finishCardio(+el.dataset.m); break;
    case "inc": case "dec":
      it = state.draft.items[+el.dataset.i]; s = it.sets[+el.dataset.j];
      var f = el.dataset.f, d = (act === "inc" ? 1 : -1) * (f === "w" ? EX[it.ex].step : 1);
      s[f] = Math.max(0, Math.round((s[f] + d)*100)/100);
      inp = document.getElementById(f+"-"+el.dataset.i+"-"+el.dataset.j); if(inp) inp.value = f === "w" ? de(s.w) : s.r;
      // ein geändertes Gewicht gilt auch für die folgenden offenen Sätze der Übung
      if(f === "w") it.sets.forEach(function(z,j){ if(j > +el.dataset.j && (!z.done || isPast())){ z.w = s.w; var o = document.getElementById("w-"+el.dataset.i+"-"+j); if(o) o.value = de(z.w); } });
      save(); break;
    case "check":
      it = state.draft.items[+el.dataset.i]; s = it.sets[+el.dataset.j];
      s.done = !s.done; el.setAttribute("aria-pressed", s.done);
      document.getElementById("set-"+el.dataset.i+"-"+el.dataset.j).classList.toggle("done", s.done);
      c = counts();
      if(isPast()){ save(); updProg(); break; }
      if(s.done){
        tone([660,880],0.18); xpFloat("+10 XP");
        if(c.done < c.total){ state.draft.restEnd = Date.now() + EX[it.ex].rest*1000; buzzed = false; }
        if(it.sets.every(function(z){ return z.done; }) && c.done < c.total) toast(TOASTS[(+el.dataset.i + state.sessions.length) % TOASTS.length]);
      } else { state.draft.restEnd = 0; buzzed = true; }
      save(); updProg(); tick();
      if(s.done && c.done === c.total) finish();
      break;
    case "addSet":
      it = state.draft.items[+el.dataset.i]; var l = it.sets[it.sets.length-1];
      it.sets.push({w:l.w,r:l.r,done:false,skip:false}); save(); render(); break;
    case "skipRest": state.draft.restEnd = 0; buzzed = true; save(); tick(); break;
    case "askFinish":
      if(isCardio()){ askCardioFinish(); break; }
      if(isPast()){ if(counts().done) finish(); else toast("Hak mindestens einen Satz ab."); break; }
      c = counts();
      if(c.done === c.total){ finish(); break; }
      openSheet("Training beenden?", c.done ? "Es sind noch "+(c.total-c.done)+" Sätze offen. Deine "+c.done+" geschafften Sätze werden gespeichert." : "Du hast noch keinen Satz abgehakt. Es wird nichts gespeichert.", "Beenden", "endNow", "Weiter trainieren");
      break;
    case "askEnd":
      if(isPast()){ openSheet("Nachtragen abbrechen?", "Es wird nichts gespeichert.", "Abbrechen", "discard", "Weiter eintragen"); break; }
      if(isCardio()){ openSheet("Cardio abbrechen?", "Es wird nichts gespeichert. Wenn du fertig bist, tipp lieber unten auf Fertig.", "Abbrechen", "endNow", "Weiter trainieren"); break; }
      c = counts();
      openSheet("Training beenden?", c.done ? "Deine "+c.done+" geschafften Sätze werden gespeichert." : "Du hast noch keinen Satz abgehakt. Es wird nichts gespeichert.", "Beenden", "endNow", "Weiter trainieren");
      break;
    case "endNow": endWorkout(); break;
    case "discard": state.draft = null; save(); closeSheet(); render(); window.scrollTo(0,0); break;
    case "closeSheet": closeSheet(); break;
    case "closeSummary": ui.summary = null; ui.tab = "train"; render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener("change",function(ev){
  var el = ev.target;
  if(el.id === "pastDate" && ui.past){
    ui.past.date = el.value;
    if(!ui.past.manual && ui.past.day !== "K"){ var pt = pastTime(el.value); if(pt) ui.past.day = dayAt(pt); }
    pastSheet(); return;
  }
  if(el.id === "cMin" && isCardio()){ setCardioMin(parseNum(el.value) || 5); return; }
  if(!el.dataset || !el.dataset.f || !state.draft) return;
  var it = state.draft.items[+el.dataset.i], s = it.sets[+el.dataset.j], f = el.dataset.f;
  if(f === "w"){
    s.w = Math.round(parseNum(el.value)*100)/100; el.value = de(s.w);
    it.sets.forEach(function(z,j){ if(j > +el.dataset.j && (!z.done || isPast())){ z.w = s.w; var o = document.getElementById("w-"+el.dataset.i+"-"+j); if(o) o.value = de(z.w); } });
  } else { s.r = Math.round(parseNum(el.value)); el.value = s.r; }
  save();
});
document.addEventListener("focusin",function(ev){ if(ev.target.dataset && (ev.target.dataset.f || ev.target.id === "cMin") && ev.target.select) ev.target.select(); });

load();
if(state.draft) wake();
render();
checkHash();
window.addEventListener("hashchange", checkHash);
})();
</script>
